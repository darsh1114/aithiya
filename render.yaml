services:
  - type: web
    runtime: node
    name: aithiya-backend
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
